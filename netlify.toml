# Netlify settings. Ignored by GitHub Pages; takes effect once the site is hosted on Netlify.

[build]
  publish = "."

# ---------- Domain: one version only (https://www.) ----------
[[redirects]]
  from = "https://allcleanz.co.uk/*"
  to = "https://www.allcleanz.co.uk/:splat"
  status = 301
  force = true

# ---------- Old Wix pages, so existing Google rankings and links carry over ----------
# Services with their own page
[[redirects]]
  from = "/end-of-tenancy-1"
  to = "/end-of-tenancy-cleaning"
  status = 301

[[redirects]]
